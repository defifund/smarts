<% password_digest = BCrypt::Password.create("password") %>
<% one_api_token = "sma_test_token_one" %>
<% two_api_token = "sma_test_token_two" %>

one:
  name: One
  email_address: one@example.com
  password_digest: <%= password_digest %>
  api_token_prefix: <%= one_api_token.first(User::API_TOKEN_PREFIX_LENGTH) %>
  api_token_digest: <%= BCrypt::Password.create(one_api_token) %>
  role: admin

two:
  name: Two
  email_address: two@example.com
  password_digest: <%= password_digest %>
  api_token_prefix: <%= two_api_token.first(User::API_TOKEN_PREFIX_LENGTH) %>
  api_token_digest: <%= BCrypt::Password.create(two_api_token) %>
  role: user
